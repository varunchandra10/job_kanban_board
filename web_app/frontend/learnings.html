<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Learnings | Job Tracker</title>
  <meta name="description" content="Track your daily study streaks, concepts, and interview preparation notes on a Kanban board.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20261023_v6">
  <script type="module" src="/auth.js"></script>
  <script src="/components.js"></script>
</head>
<body>

<app-header active="learnings" show-search="true" search-placeholder="Search concepts, notes, topics, tags..."></app-header>

<!-- Second Bar for Learnings: Categories & Add -->
<nav id="learningsSecBar" style="display:flex;">
  <button type="button" class="sec-btn active" data-cat="All">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    All <span class="badge" id="lc-All">0</span>
  </button>
  <button type="button" class="sec-btn" data-cat="DSA">
    <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    DSA <span class="badge" id="lc-DSA">0</span>
  </button>
  <button type="button" class="sec-btn" data-cat="AI/ML/NLP/CV">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
    AI/ML/NLP/CV <span class="badge" id="lc-AI">0</span>
  </button>
  <button type="button" class="sec-btn" data-cat="CS SUBJECTS">
    <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    CS SUBJECTS <span class="badge" id="lc-CS">0</span>
  </button>
  <button type="button" class="sec-btn" data-cat="GENERAL APTITUDE">
    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
    GENERAL APTITUDE <span class="badge" id="lc-APTITUDE">0</span>
  </button>
  <button type="button" class="sec-btn" data-cat="Calendar" id="calLearningBtn" title="Learning Calendar View">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendar
  </button>
  <span class="sec-sp"></span>
  <button type="button" class="btn primary add-app-toolbar-btn" id="secAddLearningBtn" onclick="openLearningModal()" style="padding:5px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border-radius:6px;margin-left:8px;" title="Add">
    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Add</span>
  </button>
</nav>

<!-- Mobile Sub-Bar (Between Topbar and Category Bar on Smaller Screens): Search Bar + Add Button -->
<div class="mobile-utility-bar" id="mobileLearningUtilityBar">
  <div class="search-wrap mobile-search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="mobileLearningSearch" class="search-input" placeholder="Search concepts, topics, tags..." autocomplete="off">
    <button type="button" id="mobileLearningSearchClear" class="search-clear" aria-label="Clear search">&times;</button>
  </div>
  <button type="button" class="btn primary add-app-toolbar-btn mobile-add-learning-btn" id="mobileAddLearningBtn" onclick="openLearningModal()" title="Add Learning">
    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Add</span>
  </button>
</div>

<!-- Mobile Category Switcher Bar (Pure Category Tabs with Full Width) -->
<div class="stage-picker-bar learning-stage-picker-bar" id="learningsStagePickerBar">
  <div class="mobile-stage-tabs" id="learningMobileTabs" role="tablist" aria-label="Learning Categories">
    <button type="button" class="stage-tab active" data-cat="All" role="tab">
      <span class="tab-dot" style="background:var(--applied-clr, #3b82f6)"></span>
      <span>All</span>
      <span class="tab-count" id="lmt-All">0</span>
    </button>
    <button type="button" class="stage-tab" data-cat="DSA" role="tab">
      <span class="tab-dot" style="background:#3b82f6"></span>
      <span>DSA</span>
      <span class="tab-count" id="lmt-DSA">0</span>
    </button>
    <button type="button" class="stage-tab" data-cat="AI/ML/NLP/CV" role="tab">
      <span class="tab-dot" style="background:#8b5cf6"></span>
      <span>AI/ML</span>
      <span class="tab-count" id="lmt-AI">0</span>
    </button>
    <button type="button" class="stage-tab" data-cat="CS SUBJECTS" role="tab">
      <span class="tab-dot" style="background:#10b981"></span>
      <span>CS</span>
      <span class="tab-count" id="lmt-CS">0</span>
    </button>
    <button type="button" class="stage-tab" data-cat="GENERAL APTITUDE" role="tab">
      <span class="tab-dot" style="background:#f59e0b"></span>
      <span>Aptitude</span>
      <span class="tab-count" id="lmt-APTITUDE">0</span>
    </button>
  </div>
</div>


<!-- Learnings Kanban Board -->
<main id="learningsView" class="learnings-board" style="display:grid;">
  <section class="col" data-cat="DSA">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--applied-clr, #3b82f6)"></span><h2>DSA</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-cat="AI/ML/NLP/CV">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--offer-clr, #ec4899)"></span><h2>AI/ML/NLP/CV</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-cat="CS SUBJECTS">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--interview-clr, #0ea5e9)"></span><h2>CS SUBJECTS</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-cat="GENERAL APTITUDE">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--rejected-clr, #f59e0b)"></span><h2>GENERAL APTITUDE</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
</main>

<div id="toast"><span id="tmsg"></span><button id="undo" style="display:none;">Undo</button></div>

<canvas id="confettiCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;"></canvas>

<!-- Log Daily Learning Slideout Drawer (Matches Job Applications Side Panel) -->
<div id="bd"></div>
<aside id="panel" aria-modal="true">
  <div class="sheet-pull-handle" id="sheetPullHandle" aria-hidden="true"></div>
  <div class="ph">
    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
      <div class="learning-modal-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;">
          <h3 id="pt" style="margin:0;font-size:15px;font-weight:700;color:var(--tx);white-space:nowrap;">Log Daily Learning</h3>
          
        </div>
        <p class="learning-modal-subtitle" style="margin:2px 0 0;font-size:11.5px;color:var(--tx3);">Track concepts & level up daily</p>
      </div>
    </div>
    <button class="btn icon-only" id="pc" aria-label="Close">&times;</button>
  </div>
  <div class="pb" id="pbody">
    <form id="learningForm" onsubmit="return false;">
      <input type="hidden" id="learningEditId" value="">

      <!-- Card 1: Track & Concept -->
      <div class="panel-section-card">
        <div class="panel-card-header">
          <span class="panel-card-title">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Learning Track
          </span>
          <span class="panel-card-subtitle">Choose track</span>
        </div>
        <div class="learning-cat-chips" id="learningCatChips">
          <button type="button" class="learning-cat-chip active" data-cat="DSA">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>DSA</span>
          </button>
          <button type="button" class="learning-cat-chip" data-cat="AI/ML/NLP/CV">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <span>AI / ML</span>
          </button>
          <button type="button" class="learning-cat-chip" data-cat="CS SUBJECTS">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>
            <span>CS Core</span>
          </button>
          <button type="button" class="learning-cat-chip" data-cat="GENERAL APTITUDE">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/></svg>
            <span>Aptitude</span>
          </button>
        </div>
        <!-- Keep select for robust fallback / DOM queries -->
        <select id="l_category" class="f-input" style="display:none;">
          <option value="DSA" selected>DSA</option>
          <option value="AI/ML/NLP/CV">AI/ML/NLP/CV</option>
          <option value="CS SUBJECTS">CS SUBJECTS</option>
          <option value="GENERAL APTITUDE">GENERAL APTITUDE</option>
        </select>

        <div class="panel-field-group" style="margin-top:4px;">
          <label class="f" for="l_title">What did you learn today? <span class="required-star" style="color:var(--rejected-clr)">*</span></label>
          <input type="text" id="l_title" placeholder="e.g., Redis Distributed Locking with Redlock & TTLs" required autocomplete="off">
        </div>

        <div class="panel-field-group">
          <label class="f" for="l_topic">Topic / Sub-concept</label>
          <input type="text" id="l_topic" list="aptitudeTopicsList" placeholder="e.g., Sliding Window, System Design, Divisibility" autocomplete="off">
          <datalist id="aptitudeTopicsList">
            <option value="Reading Comprehension (English)"></option>
            <option value="Sentence Correction & Grammar (English)"></option>
            <option value="Vocabulary, Synonyms & Antonyms (English)"></option>
            <option value="Para Jumbles & Sentence Rearrangement (English)"></option>
            <option value="Spotting Errors (English)"></option>
            <option value="Idioms & Phrases (English)"></option>
            <option value="Fill in the Blanks / Cloze Test (English)"></option>
            <option value="Percentages, Profit & Loss (Quants)"></option>
            <option value="Time, Speed & Distance (Quants)"></option>
            <option value="Time & Work, Pipes & Cisterns (Quants)"></option>
            <option value="Permutations, Combinations & Probability (Quants)"></option>
            <option value="Ratio, Proportion & Averages (Quants)"></option>
            <option value="Number Systems & Divisibility (Quants)"></option>
            <option value="Simple & Compound Interest (Quants)"></option>
            <option value="Algebra & Quadratic Equations (Quants)"></option>
            <option value="Geometry & Mensuration (Quants)"></option>
            <option value="Data Interpretation (Quants)"></option>
            <option value="Blood Relations & Family Tree (Reasoning)"></option>
            <option value="Direction Sense Test (Reasoning)"></option>
            <option value="Syllogisms & Venn Diagrams (Reasoning)"></option>
            <option value="Coding-Decoding & Series (Reasoning)"></option>
            <option value="Seating Arrangement & Puzzles (Reasoning)"></option>
            <option value="Clocks & Calendars (Reasoning)"></option>
          </datalist>
        </div>
      </div>

      <!-- Card 2: Schedule & Duration -->
      <div class="panel-section-card">
        <div class="panel-card-header">
          <span class="panel-card-title">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Study Session & Time
          </span>
        </div>
        <div class="row">
          <div>
            <label class="f" for="l_date">Date Logged</label>
            <input type="date" id="l_date">
          </div>
          <div>
            <label class="f" for="l_duration">Study Duration</label>
            <div class="duration-input-wrapper">
              <input type="number" id="l_duration" min="5" max="600" step="5" value="45">
              <span class="duration-unit">minutes</span>
            </div>
          </div>
        </div>
        <div style="margin-top:4px;">
          <label class="f" style="font-size:11px;color:var(--tx3);margin-bottom:4px;display:block;">Quick duration presets</label>
          <div class="duration-presets" id="l_duration_presets">
            <button type="button" class="preset-pill" data-m="15">15m</button>
            <button type="button" class="preset-pill" data-m="25">25m (Pomo)</button>
            <button type="button" class="preset-pill active" data-m="45">45m</button>
            <button type="button" class="preset-pill" data-m="60">60m (1 hr)</button>
            <button type="button" class="preset-pill" data-m="90">90m</button>
            <button type="button" class="preset-pill" data-m="120">120m (2 hrs)</button>
          </div>
        </div>
      </div>

      <!-- Card 3: Deep Dive, Notes & Reference -->
      <div class="panel-section-card">
        <div class="panel-card-header">
          <span class="panel-card-title">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Insights & Reference
          </span>
        </div>
        <div class="panel-field-group">
          <label class="f" for="l_resource">Resource / Reference Link</label>
          <input type="url" id="l_resource" placeholder="https://leetcode.com/... or article URL" autocomplete="off">
        </div>

        <div class="panel-field-group">
          <label class="f" for="l_notes">Key Insights / Summary Notes</label>
          <textarea id="l_notes" rows="3" placeholder="Summarize core patterns, tricky edge cases, time/space complexity, or trade-offs..."></textarea>
        </div>

        <div class="panel-field-group">
          <label class="f" for="l_tags">Tags (comma-separated)</label>
          <input type="text" id="l_tags" placeholder="e.g., LeetCode, SlidingWindow, Redis, Hard" autocomplete="off">
        </div>
      </div>

      <!-- Pinned Sticky Footer -->
      <div class="panel-sticky-footer">
        <button type="button" class="btn" id="cancelLearningModal">Cancel</button>
        <button type="button" class="btn primary add-learning-btn" id="submitLearningBtn">
          <span style="display:inline-flex;align-items:center;gap:6px;">🔥 Log Learning</span>
        </button>
      </div>
    </form>
  </div>
</aside>

<script type="module" src="/learnings.js"></script>

</body>
</html>
