<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job Tracker - Applications Board</title>
  <meta name="description" content="Professional internship and job application tracker with clean Kanban board, activity timeline, and analytics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20261023_v6">
  <script type="module" src="/auth.js"></script>
  <script src="/components.js"></script>
</head>
<body>

<app-header active="board" show-search="true" search-placeholder="Search company, role, notes..."></app-header>

<nav id="secBar">
  <button class="sec-btn active" data-s="All">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    All <span class="badge" id="sc-All">0</span>
  </button>
  <button class="sec-btn" data-s="Industry">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    Industry <span class="badge" id="sc-Industry">0</span>
  </button>
  <button class="sec-btn" data-s="Government">
    <svg viewBox="0 0 24 24"><path d="M2 20h20M4 20v-7M8 20v-7M12 20v-7M16 20v-7M20 20v-7M12 4L2 9h20l-10-5z"/></svg>
    Government <span class="badge" id="sc-Government">0</span>
  </button>
  <button class="sec-btn" data-s="Research">
    <svg viewBox="0 0 24 24"><path d="M10 2v7.31L4.65 19.3A2 2 0 0 0 6.4 22h11.2a2 2 0 0 0 1.75-2.7L14 9.31V2M8.5 2h7M7 16h10"/></svg>
    Research <span class="badge" id="sc-Research">0</span>
  </button>
  <button class="sec-btn" data-s="Calendar" id="calSecBtn" title="Calendar View">
    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendar
  </button>
  <span class="sec-sp"></span>
  <div class="country-filter-wrap fwrap" id="fwrap">
    <button class="sec-btn" id="fbtn" aria-haspopup="true" aria-expanded="false">All countries &#9662;</button>
    <div class="pop fpop" id="fpop"></div>
  </div>
  <button class="btn primary add-app-toolbar-btn" id="addBtn" style="padding:5px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border-radius:6px;" title="Add Application">
    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Add</span>
  </button>
</nav>

<!-- Mobile Sub-Bar (Between Topbar and Stage Bar on Smaller Screens): Search Bar + All Countries + Add Button -->
<div class="mobile-utility-bar" id="mobileUtilityBar">
  <div class="search-wrap mobile-search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="mobileSearch" class="search-input" placeholder="Search company, role, notes..." autocomplete="off">
    <button type="button" id="mobileSearchClear" class="search-clear" aria-label="Clear search">&times;</button>
  </div>
  <div class="country-filter-wrap fwrap mobile-fwrap" id="mobileFwrap">
    <button type="button" class="sec-btn mobile-fbtn" id="mobileFbtn" aria-haspopup="true" aria-expanded="false" title="Filter by country">
      <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="mobile-fbtn-text" id="mobileFbtnText">All</span>
      <span class="mobile-fbtn-arrow" style="font-size:9px;margin-left:2px;">&#9662;</span>
    </button>
    <div class="pop fpop mobile-fpop" id="mobileFpop"></div>
  </div>
  <button type="button" class="btn primary add-app-toolbar-btn mobile-add-app-btn" id="mobileAddBtn" title="Add Application">
    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Add</span>
  </button>
</div>

<!-- Mobile Stage Switcher Bar (Pure Stage Tabs with Full Width) -->
<div class="stage-picker-bar" id="stagePickerBar">
  <div class="mobile-stage-tabs" id="mobileStageTabs" role="tablist" aria-label="Job Application Stages">
    <button type="button" class="stage-tab active" data-stage="Bookmarked" role="tab">
      <span class="tab-dot" style="background:var(--bookmarked-clr, #8b5cf6)"></span>
      <span>Bookmarked</span>
      <span class="tab-count">0</span>
    </button>
    <button type="button" class="stage-tab" data-stage="Applied" role="tab">
      <span class="tab-dot" style="background:var(--applied-clr, #3b82f6)"></span>
      <span>Applied</span>
      <span class="tab-count">0</span>
    </button>
    <button type="button" class="stage-tab" data-stage="Interviewing" role="tab">
      <span class="tab-dot" style="background:var(--interview-clr, #f59e0b)"></span>
      <span>Interviewing</span>
      <span class="tab-count">0</span>
    </button>
    <button type="button" class="stage-tab" data-stage="Offer" role="tab">
      <span class="tab-dot" style="background:var(--offer-clr, #10b981)"></span>
      <span>Offer</span>
      <span class="tab-count">0</span>
    </button>
    <button type="button" class="stage-tab" data-stage="Rejected" role="tab">
      <span class="tab-dot" style="background:var(--rejected-clr, #ef4444)"></span>
      <span>Rejected</span>
      <span class="tab-count">0</span>
    </button>
    <button type="button" class="stage-tab" data-stage="Calendar" role="tab" title="Calendar View">
      <span class="tab-dot" style="background:#8b5cf6"></span>
      <span>Calendar</span>
    </button>
  </div>

  <div class="stage-picker-select-wrap">
    <span class="stage-picker-dot" id="stagePickerDot" aria-hidden="true"></span>
    <select id="stageSelect" class="stage-picker-select" aria-label="Select stage column"></select>
    <span class="stage-count-badge" id="stageCountBadge" aria-live="polite">0</span>
  </div>
</div>

<main id="board">
  <section class="col" data-stage="Bookmarked">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--bookmarked-clr, #8b5cf6)"></span><h2>Bookmarked</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-stage="Applied">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--applied-clr, #3b82f6)"></span><h2>Applied</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-stage="Interviewing">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--interview-clr, #f59e0b)"></span><h2>Interviewing</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-stage="Offer">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--offer-clr, #10b981)"></span><h2>Offer</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
  <section class="col" data-stage="Rejected">
    <div class="col-header"><span class="col-stage-dot" style="background:var(--rejected-clr, #ef4444)"></span><h2>Rejected</h2><span class="col-count">...</span></div>
    <div class="body">
      <div class="skeleton-card"><div class="skeleton-top"><div class="skeleton-avatar skeleton-shimmer"></div><div class="skeleton-text-group"><div class="skeleton-line w-70 skeleton-shimmer"></div><div class="skeleton-line w-45 skeleton-shimmer"></div></div></div><div class="skeleton-line w-85 skeleton-shimmer"></div><div class="skeleton-tags-row"><div class="skeleton-pill skeleton-shimmer"></div><div class="skeleton-pill skeleton-shimmer"></div></div></div>
    </div>
  </section>
</main>

<div id="bd"></div>

<aside id="panel" aria-modal="true">
  <div class="sheet-pull-handle" id="sheetPullHandle" aria-hidden="true"></div>
  <div class="ph">
    <h3 id="pt"></h3>
    <span id="saved">Saved</span>
    <button class="btn icon-only" id="pc" aria-label="Close">&times;</button>
  </div>
  <div class="pb" id="pbody"></div>
</aside>

<div id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>

<!-- Shutdown Modal -->
<div id="shutdownModal" class="confirm-modal-overlay" style="display:none;" aria-modal="true" role="dialog">
  <div class="confirm-modal-box">
    <div class="confirm-modal-header">
      <div class="confirm-modal-icon warning">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div>
        <h3 class="confirm-modal-title">Close Application Tracker?</h3>
        <p class="confirm-modal-text">This will stop the local background server and close the terminal. You will need to rerun <code>start.bat</code> to launch it again.</p>
      </div>
    </div>
    <div class="confirm-modal-actions">
      <button type="button" class="btn" id="cancelShutdownBtn">Cancel</button>
      <button type="button" class="btn danger" id="confirmShutdownBtn">Yes, Shut Down</button>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>

</body>
</html>
