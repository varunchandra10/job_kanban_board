name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-desktop:
    name: Desktop CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop_app/src-tauri

      - name: Install Node dependencies
        run: |
          npm ci || npm install
          npm --prefix desktop_app install

      - name: Build Web Assets
        run: npm run build:web

      - name: Cargo Check
        run: cargo check --manifest-path desktop_app/src-tauri/Cargo.toml

      - name: Headless Export & Permissions Verification Test
        run: cargo test --manifest-path desktop_app/src-tauri/Cargo.toml -- --nocapture
