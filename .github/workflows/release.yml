name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x64'
            os: windows-latest
            args: ''
          - platform: 'macos-x64'
            os: macos-13
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-arm64'
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: 'linux-x64'
            os: ubuntu-22.04
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-x64' && 'x86_64-apple-darwin' || (matrix.platform == 'macos-arm64' && 'aarch64-apple-darwin' || '') }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop_app/src-tauri

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Headless Export & Permissions Verification
        run: cargo test --manifest-path desktop_app/src-tauri/Cargo.toml -- --nocapture

      - name: Build Web Assets
        run: npm run build:web

      - name: Build & Publish Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop_app
          tagName: ${{ github.ref_name }}
          releaseName: 'Job Tracker Desktop ${{ github.ref_name }}'
          releaseBody: 'Production release for Job Tracker Desktop. See [CHANGELOG.md](https://github.com/varunchandra10/job_kanban_board/blob/main/CHANGELOG.md) for detailed notes.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
